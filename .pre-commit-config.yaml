# setup-formatting 2026-11-07: rules 2
repos:
  - repo: local
    hooks:
      - id: mdformat
        name: mdformat
        entry: uv run --frozen mdformat --wrap 80 --number
        language: system
        types: [markdown]
        # memory notes use [[wiki links]], which mdformat escapes
        exclude: ^\.claude/memory/
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types_or: [python, jupyter]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, jupyter, markdown]
      # pre-commit does not tag bin/moss (shebang `env -S uv run`) as python
      - id: ruff-check-moss
        name: ruff check (bin/moss)
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        files: ^bin/moss$
      - id: ruff-format-moss
        name: ruff format (bin/moss)
        entry: uv run --frozen ruff format --force-exclude
        language: system
        files: ^bin/moss$
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run --frozen trailing-whitespace-fixer
        language: system
        types: [yaml]
      - id: yamlfmt
        name: yamlfmt
        entry: uv run --frozen yamlfmt
        language: system
        types: [yaml]
      - id: pretty-format-json
        name: pretty-format-json
        entry: uv run --frozen pretty-format-json --autofix --indent 2 --no-sort-keys
        language: system
        types: [json]
        exclude: \.ipynb$
      - id: shfmt
        name: shfmt
        entry: uv run --frozen shfmt -w -i 2 -ci -bn -ln bash
        language: system
        types: [shell]
      - id: taplo
        name: taplo
        entry: uv run --frozen taplo fmt -o "indent_string=    " -o array_auto_collapse=false
        language: system
        types: [toml]
        exclude: \.lock$
      # look like the keyboard's "-" but are not: the instructions' Always section
      - id: keyboard-dashes
        name: no U+2013 EN DASH or U+2212 MINUS SIGN
        # pygrep matches bytes: each character's whole UTF-8 sequence, or U+2014 matches
        entry: '\xe2\x80\x93|\xe2\x88\x92'
        language: pygrep
        types: [text]
      - id: prettier
        name: prettier
        entry: prettier --write
        language: node
        additional_dependencies: [prettier@3.9.10]
        types_or: [css, javascript]
        # generated by create_app() at every startup
        exclude: ^src/uiexam/static/pygments\.css$
