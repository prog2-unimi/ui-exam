[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[project]
name = "examui"
version = "0.1.0"
description = "Oral exam assistant web UI"
requires-python = ">=3.11"
dependencies = [
    "flask",
    "gunicorn",
    "pandas",
    "xlrd",
    "pygments",
    "tree-sitter",
    "tree-sitter-java",
    "openpyxl>=3.1.5",
    "graphviz>=0.20",
    "requests",
    "rapidfuzz>=3.14",
    "pygount>=1.8",
    "click>=8.0",
    "rich>=13.0",
    "mosspy>=1.0",
]

[project.scripts]
exam-pipeline = "examui.pipeline:cli"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.7.0",
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "mdformat-frontmatter>=2.1.2",
    "google-yamlfmt>=0.21.0",
    "pre-commit-hooks>=6.0.0",
    "shfmt-py>=4.2.0",
]

[tool.ruff]
line-length     = 100
indent-width    = 2
extend-include  = ["bin/moss"]

[tool.ruff.format]
indent-style  = "space"
quote-style   = "single"
